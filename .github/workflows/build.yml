name: Build DAW-Discord-Bridge (Windows x64)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/DAWDiscordBridge_artefacts/Release/VST3/DAW-Discord-Bridge.vst3" "dist/DAW-Discord-Bridge.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DAW-Discord-Bridge-VST3-win64
          path: dist
          if-no-files-found: error
